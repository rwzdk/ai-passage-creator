# ========================================
# 生产环境配置（Docker 部署使用）
# ========================================

server:
  port: 8123

spring:
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  # MySQL 数据库配置（通过环境变量覆盖）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_passage_creator?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
  # Redis 配置（通过环境变量覆盖）
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: 0
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  # AI 配置
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}

# Pexels API 配置
pexels:
  api-key: ${PEXELS_API_KEY:}

feedback:
  mail:
    recipient: ${FEEDBACK_MAIL_RECIPIENT:235173498@qq.com}
    sender-name: ${FEEDBACK_MAIL_SENDER_NAME:YuanJian Studio}

# Nano Banana API 配置（可选）
nano-banana:
  api-key: ${NANO_BANANA_API_KEY:}
  model: ${NANO_BANANA_MODEL:gemini-2.5-flash-image}
  aspect-ratio: ${NANO_BANANA_ASPECT_RATIO:16:9}
  image-size: ${NANO_BANANA_IMAGE_SIZE:1K}

nano-banana-apiclaude:
  api-key: ${NANO_BANANA_APICLAUDE_API_KEY:}
  base-url: ${NANO_BANANA_APICLAUDE_BASE_URL:https://apiclaude.cc}
  model: ${NANO_BANANA_APICLAUDE_MODEL:gemini-3-pro-image-preview}
  aspect-ratio: ${NANO_BANANA_APICLAUDE_ASPECT_RATIO:16:9}
  image-size: ${NANO_BANANA_APICLAUDE_IMAGE_SIZE:1K}

# GPT Image 2（apiclaude OpenAI 兼容接口）
image-2:
  api-key: ${IMAGE_2_API_KEY:}
  base-url: ${IMAGE_2_BASE_URL:https://apiclaude.cc}
  model: ${IMAGE_2_MODEL:gpt-image-2}
  size: ${IMAGE_2_SIZE:1024x1024}
  n: ${IMAGE_2_N:1}

# Stripe 支付配置（可选）
stripe:
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  success-url: ${STRIPE_SUCCESS_URL:https://mindofqc.me/vip?success=true}
  cancel-url: ${STRIPE_CANCEL_URL:https://mindofqc.me/vip?cancelled=true}

# 腾讯云 COS 配置（可选）
tencent:
  cos:
    secret-id: ${TENCENT_COS_SECRET_ID:}
    secret-key: ${TENCENT_COS_SECRET_KEY:}
    region: ${TENCENT_COS_REGION:ap-guangzhou}
    bucket: ${TENCENT_COS_BUCKET:}
