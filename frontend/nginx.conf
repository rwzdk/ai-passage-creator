# ========================================
# 沅笺 · YuanJian Studio - Nginx 配置
# ========================================

server {
    listen 80;
    listen 443 ssl;
    server_name localhost mindofqc.me;
    ssl_certificate /etc/nginx/mindofqc-fullchain.pem;
    ssl_certificate_key /etc/nginx/mindofqc-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # 设置客户端请求体最大大小（用于文件上传）
    client_max_body_size 20M;
    
    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;

    # Vite 的入口文件必须及时更新，带 hash 的构建产物可以长期缓存。
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|webp|avif|png|jpg|jpeg|gif|ico)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 静态资源配置
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
    }

    # SSE 进度流必须保持长连接，不能发送 WebSocket 升级头
    location /api/article/progress/ {
        proxy_pass http://backend:8123/api/article/progress/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-cache" always;
        add_header X-Accel-Buffering "no" always;
    }

    # 反向代理后端 API
    location /api/ {
        proxy_pass http://backend:8123/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 普通 API 不需要 WebSocket 升级，避免中间层错误复用连接
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
